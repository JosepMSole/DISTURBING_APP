<body><div class="box"><div class="ring"></div><h1>Actualizando Disturbing Stories APP</h1><p>Limpiando la versión visual anterior sin borrar tus Stories leídas ni tus desbloqueos…</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('disturbing-pwa-')).map(k=>caches.delete(k)));
    }
  }catch(e){}
  const stamp=Date.now();
  location.replace('./?fresh=4.10.0-'+stamp+'#/home');
})();
