<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03080b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Disturbing Stories APP" />
  <meta name="application-name" content="Disturbing Stories APP" />
  <link rel="manifest" href="manifest.webmanifest?v=4.1.0" />
  <link rel="icon" type="image/png" href="assets/app-icon.png?v=4.1.0" />
  <link rel="shortcut icon" type="image/png" href="assets/app-icon.png?v=4.1.0" />
  <link rel="icon" href="favicon.ico?v=4.1.0" sizes="any" />
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=4.1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=4.1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Oxanium:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4.1.0" />
  <title>Disturbing Stories APP</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button id="brandBtn" class="brand" aria-label="Inicio">
          <img class="brand-home-icon" src="assets/app-icon.png" alt="Disturbing Stories" onload="this.classList.add('ready');this.nextElementSibling.classList.add('hidden')" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.classList.add('logo-fallback');this.src='assets/disturbing-logo.png'}else{this.classList.add('hidden')}">
          <span class="brand-fallback"><span class="brand-main">DISTURBING</span><span class="brand-sub">STORIES</span></span>
        </button>
        <button id="backBtn" class="back-nav-btn hidden" aria-label="Atrás">‹ ATRÁS</button>
        <span id="sectionIndicator" class="section-indicator" aria-label="Sección actual"></span>
        <span id="userGreeting" class="user-greeting hidden" aria-live="polite"></span>
      </div>
      <div class="topbar-actions">
        <button id="toTopHeaderBtn" class="icon-btn top-jump" aria-label="Ir arriba del todo" title="Ir arriba">↑</button>
        <button id="menuBtn" class="icon-btn menu-square-btn" aria-label="Menú"><span class="burger-glyph" aria-hidden="true"><i></i><i></i><i></i></span></button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-btn active" aria-label="Inicio"><span class="nav-icon nav-home" aria-hidden="true">⌂</span></button>
      <button data-route="stories" class="nav-btn" aria-label="Stories"><span class="nav-icon nav-grid9" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button data-route="unlocked" class="nav-btn" aria-label="Mis Stories"><span class="nav-icon nav-watcher" aria-hidden="true"><svg viewBox="0 0 24 24" role="presentation"><path d="M3.2 12s3.2-5.2 8.8-5.2S20.8 12 20.8 12s-3.2 5.2-8.8 5.2S3.2 12 3.2 12Z"/><circle cx="12" cy="12" r="2.15"/><circle class="watcher-pupil" cx="12.7" cy="11.3" r=".45"/></svg></span></button>
      <button data-route="collection" class="nav-btn" aria-label="Colección"><span class="nav-icon nav-collection4" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
      <button data-route="player" class="nav-btn" aria-label="Player"><span class="nav-icon nav-player" aria-hidden="true">♫</span></button>
    </nav>

    <div id="miniPlayer" class="mini-player hidden" aria-label="Player">
      <button id="miniPlayerOpen" class="mini-player-main" aria-label="Abrir Player">
        <span class="mini-player-kicker">♫ PLAYER</span>
        <strong id="miniPlayerTrack">—</strong>
        <span class="mini-player-progress"><i id="miniPlayerProgress"></i></span>
      </button>
      <button id="miniPrev" class="mini-player-btn" aria-label="Anterior">‹</button>
      <button id="miniPlay" class="mini-player-btn mini-play" aria-label="Play/Pause">▶</button>
      <button id="miniNext" class="mini-player-btn" aria-label="Siguiente">›</button>
    </div>
    <audio id="globalPlayerAudio" preload="auto"></audio>

    <aside id="drawer" class="drawer" aria-hidden="true">
      <button id="closeDrawer" class="drawer-close">×</button>
      <button class="drawer-brand" data-drawer-route="home" aria-label="Inicio">
        <img class="drawer-logo" src="assets/disturbing-logo.png" alt="Disturbing Stories" onload="this.classList.add('ready');this.nextElementSibling.classList.add('hidden')" onerror="this.classList.add('hidden')">
        <span class="drawer-brand-fallback"><span>DISTURBING</span><small>STORIES</small></span>
      </button>
      <button data-drawer-route="home"><span class="drawer-menu-icon drawer-home-icon" aria-hidden="true">⌂</span><span>Última Story</span></button>
      <button data-drawer-route="stories"><span class="drawer-menu-icon drawer-grid9" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span>Todas las Stories</span></button>
      <button data-drawer-route="unlocked"><span class="drawer-menu-icon drawer-watcher" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.2 12s3.2-5.2 8.8-5.2S20.8 12 20.8 12s-3.2 5.2-8.8 5.2S3.2 12 3.2 12Z"/><circle cx="12" cy="12" r="2.15"/><circle class="watcher-pupil" cx="12.7" cy="11.3" r=".45"/></svg></span><span>Mis Stories</span></button>
      <button data-drawer-route="collection"><span class="drawer-menu-icon drawer-bars4" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Colección</span></button>
      <button data-drawer-route="player"><span class="drawer-menu-icon drawer-music" aria-hidden="true">♫</span><span>Player</span></button>
      <div class="drawer-disabled drawer-no-icon" aria-disabled="true"><span>Tutoriales</span></div>
      <button id="scanBtn"><span class="drawer-menu-icon drawer-qr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM17 17h3v3h-3z"/></svg></span><span>Desbloquear Story</span></button>
      <button id="installBtn" class="hidden"><span class="drawer-menu-icon drawer-install" aria-hidden="true"><svg class="install-app-svg" viewBox="0 0 24 24"><path d="M12 3v10"/><path d="m8 10 4 4 4-4"/><path d="M5 16.5v1.2A2.3 2.3 0 0 0 7.3 20h9.4A2.3 2.3 0 0 0 19 17.7v-1.2"/></svg></span><span>Instalar App</span></button>
      <button id="userMenuBtn"><span class="drawer-menu-icon drawer-user" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.7" r="3.3"/><path d="M5.4 20c.45-4.45 2.9-7 6.6-7s6.15 2.55 6.6 7"/></svg></span><span id="userMenuLabel">Usuario No Registrado</span></button>
      <p class="drawer-note"><span>v4.1 © All rights reserved</span><a href="https://www.disturbingstories.com/contact.html" target="_blank" rel="noopener">Vianda Visual 2026</a></p>
    </aside>
    <div id="scrim" class="scrim hidden"></div>
    <div id="introLayer" class="intro-layer hidden" aria-hidden="true">
      <video id="introVideo" class="intro-video" muted playsinline preload="auto" src="assets/intro.webm"></video>
    </div>
  </div>

  <template id="loadingTemplate"><div class="loading"><div class="spinner"></div><p>Cargando Stories…</p></div></template>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="supabase-config.js?v=4.1.0" defer></script>
  <script src="app.js?v=4.1.0" defer></script>
</body>
</html>
